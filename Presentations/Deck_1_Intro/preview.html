<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JRFK Presentation 1: Interactive Preview</title>
    <style>
        body {
            margin: 0;
            background: #0a192f;
            color: #ffffff;
            font-family: 'Segoe UI', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .player-box {
            width: 1024px;
            background: #134679;
            border: 2px solid #38bdf8;
            border-radius: 8px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .slide-frame {
            width: 1024px;
            height: 576px;
            border: none;
            background: #000;
        }
        .controls {
            padding: 12px 20px;
            background: #0f172a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #334155;
        }
        .btn {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
        }
        .btn:hover { background: #3b82f6; }
        .meta { font-size: 14px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="player-box">
        <iframe id="slideFrame" class="slide-frame" src="slide_1.html"></iframe>
        <div class="controls">
            <div>
                <button class="btn" onclick="prevSlide()">◀ Previous</button>
                <button class="btn" onclick="nextSlide()">Next ▶</button>
                <button class="btn" style="background:#16a34a;" onclick="playAudio()">🔊 Play Feynman Audio</button>
            </div>
            <div class="meta" id="slideMeta">Slide 1 of 5: Modernizing the RF-KIT Linear Amplifier</div>
        </div>
    </div>
    <audio id="audioPlayer"></audio>

    <script>
        const slides = [
            { id: "slide_1", title: "Modernizing the RF-KIT Linear Amplifier", audio: "audio/slide_1.mp3" },
            { id: "slide_2", title: "Why Legacy 32-Bit OS Must Go", audio: "audio/slide_2.mp3" },
            { id: "slide_3", title: "Dual-Port Architecture: 8089 vs 8088", audio: "audio/slide_3.mp3" },
            { id: "slide_4", title: "4-Volume Documentation & K7BIT Cookbook", audio: "audio/slide_4.mp3" },
            { id: "slide_outro", title: "Resources & Project Downloads", audio: "audio/slide_outro.mp3" }
        ];
        let currentIdx = 0;

        function updateSlide() {
            const s = slides[currentIdx];
            document.getElementById('slideFrame').src = s.id + '.html';
            document.getElementById('slideMeta').innerText = `Slide ${currentIdx + 1} of ${slides.length}: ${s.title}`;
            playAudio();
        }

        function playAudio() {
            const player = document.getElementById('audioPlayer');
            player.src = slides[currentIdx].audio;
            player.play().catch(e => console.log('Autoplay deferred until user interaction'));
        }

        function nextSlide() {
            if (currentIdx < slides.length - 1) {
                currentIdx++;
                updateSlide();
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                updateSlide();
            }
        }
    </script>
</body>
</html>
