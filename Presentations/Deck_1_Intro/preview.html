<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JRFK Deck 1 Master Review - Station K7BIT</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0f1d; color: #f8fafc; margin: 0; padding: 25px; }
        .container { max-width: 1500px; margin: 0 auto; }
        header { border-bottom: 2px solid #38bdf8; padding-bottom: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 26px; color: #38bdf8; font-weight: 800; }
        .callsign { font-size: 18px; font-weight: bold; background: #0284c7; padding: 6px 16px; border-radius: 4px; letter-spacing: 1.5px; }
        .viewer { display: flex; gap: 25px; background: #131d31; padding: 25px; border-radius: 10px; box-shadow: 0 6px 30px rgba(0,0,0,0.6); }
        .slide-view { flex: 3; display: flex; flex-direction: column; align-items: center; }
        .slide-view img { width: 100%; border-radius: 6px; border: 1px solid #334155; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .playlist { flex: 1.1; display: flex; flex-direction: column; gap: 8px; max-height: 780px; overflow-y: auto; padding-right: 5px; }
        .playlist-btn { background: #0a0f1d; border: 1px solid #1e293b; color: #94a3b8; padding: 12px 14px; border-radius: 6px; cursor: pointer; text-align: left; transition: all 0.2s; font-size: 14px; line-height: 1.3; }
        .playlist-btn:hover { background: #1e293b; color: #f8fafc; border-color: #38bdf8; }
        .playlist-btn.active { background: #0284c7; color: #ffffff; border-color: #38bdf8; font-weight: bold; }
        .controls { width: 100%; margin-top: 15px; background: #0a0f1d; padding: 15px; border-radius: 6px; border: 1px solid #334155; }
        audio { width: 100%; height: 48px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>JRFK Modernization Master Deck</h1>
                <div style="color: #94a3b8; font-size: 15px; margin-top: 4px;">Presentation 1: Architectural Requirement, 32-to-64 Bit Payoff, and Tool Suite Overview</div>
            </div>
            <div class="callsign">CALLSIGN: K7BIT</div>
        </header>
        
        <div class="viewer">
            <div class="slide-view">
                <img id="slideImg" src="slide_01.png" alt="Current Slide">
                <div class="controls">
                    <audio id="audioPlayer" controls autoplay src="slide_01.mp3"></audio>
                </div>
            </div>
            <div class="playlist" id="playlist"></div>
        </div>
    </div>

    <script>
        const slides = [
            {"id": 1, "title": "01: JRFK Suite: Modernizing RF Controllers", "image": "slide_01.png", "audio": "slide_01.mp3"},
            {"id": 2, "title": "02: Why 32-Bit Must Go: Software EOL", "image": "slide_02.png", "audio": "slide_02.mp3"},
            {"id": 3, "title": "03: Why 32-Bit Must Go: Display & RF Locks", "image": "slide_03.png", "audio": "slide_03.mp3"},
            {"id": 4, "title": "04: 64-Bit Architecture Overview: Payoff", "image": "slide_04.png", "audio": "slide_04.mp3"},
            {"id": 5, "title": "05: Tool 1: JRFK Standalone Migrator", "image": "slide_05.png", "audio": "slide_05.mp3"},
            {"id": 6, "title": "06: Tool 1 in Action: Discovery & Flashing", "image": "slide_06.png", "audio": "slide_06.mp3"},
            {"id": 7, "title": "07: Tool 2: 7-Screen Web Suite — Telemetry", "image": "slide_07.png", "audio": "slide_07.mp3"},
            {"id": 8, "title": "08: Tool 2: PA Monitoring & Antenna Matrix", "image": "slide_08.png", "audio": "slide_08.mp3"},
            {"id": 9, "title": "09: Tool 2: Protection Systems & Touch Cal", "image": "slide_09.png", "audio": "slide_09.mp3"},
            {"id": 10, "title": "10: Tool 3: 3-Min Disaster Recovery Card", "image": "slide_10.png", "audio": "slide_10.mp3"},
            {"id": 11, "title": "11: Tool 3: First-Boot & Self-Healing", "image": "slide_11.png", "audio": "slide_11.mp3"},
            {"id": 12, "title": "12: Tool 4: Docs Portal & K7BIT Cookbook", "image": "slide_12.png", "audio": "slide_12.mp3"},
            {"id": 13, "title": "13: Summary & Master Resource Directory", "image": "slide_13.png", "audio": "slide_13.mp3"}
        ];

        let currentIndex = 0;
        const img = document.getElementById('slideImg');
        const audio = document.getElementById('audioPlayer');
        const playlist = document.getElementById('playlist');

        function loadSlide(index) {
            currentIndex = index;
            img.src = slides[index].image;
            audio.src = slides[index].audio;
            audio.play().catch(function(e) { console.log('Autoplay deferred'); });
            
            document.querySelectorAll('.playlist-btn').forEach(function(btn, idx) {
                if (idx === index) btn.classList.add('active');
                else btn.classList.remove('active');
            });
        }

        slides.forEach(function(slide, idx) {
            const btn = document.createElement('button');
            btn.className = 'playlist-btn' + (idx === 0 ? ' active' : '');
            btn.innerText = slide.title;
            btn.onclick = function() { loadSlide(idx); };
            playlist.appendChild(btn);
        });

        audio.onended = function() {
            if (currentIndex + 1 < slides.length) {
                loadSlide(currentIndex + 1);
            }
        };
    </script>
</body>
</html>
